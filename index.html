<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E9E4F">
<title>Собеседование: мой опыт</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7F5;--surface:#FFFFFF;--surface-2:#EEF3F0;--ink:#1B2420;--muted:#5D6C66;--line:#D9E2DD;
  --green:#2E9E4F;--green-dark:#22783B;--green-soft:#E3F4E8;
  --red:#D9434A;--red-dark:#A8333A;--red-soft:#FBE7E8;
  --amber:#E89A12;--amber-dark:#B5770B;--amber-soft:#FDF2DC;
  --blue:#2D7BE0;--blue-soft:#E4EEFC;--ph:#FFF3C4;--ph-ink:#5A4300;
  --radius:16px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614;--surface:#19201D;--surface-2:#202925;--ink:#E7EEEA;--muted:#9BABA4;--line:#2D3833;
  --green:#3BBE62;--green-dark:#2A8F48;--green-soft:#173524;
  --red:#F06A70;--red-dark:#B5474C;--red-soft:#3A1C1E;
  --amber:#F4B23A;--amber-dark:#B98420;--amber-soft:#382A10;
  --blue:#5B9BF0;--blue-soft:#172A44;--ph:#4A3C10;--ph-ink:#FFE7A3;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614;--surface:#19201D;--surface-2:#202925;--ink:#E7EEEA;--muted:#9BABA4;--line:#2D3833;
  --green:#3BBE62;--green-dark:#2A8F48;--green-soft:#173524;
  --red:#F06A70;--red-dark:#B5474C;--red-soft:#3A1C1E;
  --amber:#F4B23A;--amber-dark:#B98420;--amber-soft:#382A10;
  --blue:#5B9BF0;--blue-soft:#172A44;--ph:#4A3C10;--ph-ink:#FFE7A3;color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:6px}
pre{background:var(--surface-2);border-radius:12px;padding:12px 14px;overflow-x:auto;font-size:13.5px;line-height:1.45;margin:10px 0 0}
pre code{background:none;padding:0;font-size:inherit}
mark.ph{background:var(--ph);color:var(--ph-ink);border-radius:5px;padding:0 4px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 140px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:14px;align-items:center;padding:10px 0 12px;font-weight:800}
.top .stat{display:flex;align-items:center;gap:5px;font-size:16px}
.top .goal{flex:1;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.top .goal i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .3s}
h1{font-size:28px;line-height:1.2;margin:8px 0 4px;font-weight:900;letter-spacing:-.01em}
h2{font-size:20px;margin:0 0 6px;font-weight:800}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:16px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 22px}
.tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--radius);padding:12px 14px}
.tile b{font-size:16px}.tile span{color:var(--muted);font-size:14px}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tip{background:var(--blue-soft);border:2px solid transparent;border-radius:var(--radius);padding:12px 14px;margin:0 0 18px;font-size:15px}
.tip button{background:none;border:0;color:var(--blue);font-weight:800;padding:0;margin-right:14px}
.path{display:flex;flex-direction:column;gap:12px}
.unit{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%}
.unit.rec{border-color:var(--green)}
.unit .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--green-soft)}
.unit .t{font-weight:800}.unit .p{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:900;font-size:16px;letter-spacing:.02em;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dark)}
.btn:disabled{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-dark)}
.btn.amber{background:var(--amber);box-shadow:0 4px 0 var(--amber-dark)}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lessonbar{display:flex;align-items:center;gap:12px;padding:10px 0 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);padding:4px 8px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.kind{font-weight:800;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
.qtext{font-size:21px;font-weight:800;line-height:1.35;margin:0 0 16px}
.hint{color:var(--muted);font-size:15px;margin:-6px 0 16px}
.answer{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 14px}
.keys{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.keys li{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.keys li::before{content:"●";color:var(--green);font-size:10px;margin-top:6px}
details{margin-top:10px}summary{cursor:pointer;color:var(--blue);font-weight:800;font-size:15px}
.trap{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:600}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.cloze{font-size:18px;line-height:1.6}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--blue);color:var(--blue);font-weight:800;text-align:center}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px}
.pairs .opt{font-size:14.5px;padding:11px 12px;min-height:56px}
.pairs .opt.done{opacity:.35;border-color:var(--green)}
.pairs .opt.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.order-target{min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.order-target:empty::before{content:"Нажимай шаги по порядку";color:var(--muted);font-size:15px;padding:8px}
.chip{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
.chip .n{display:inline-block;min-width:22px;font-weight:900;color:var(--blue)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:20}
.sheet .in{max-width:640px;margin:0 auto}
.sheet.good{background:var(--green-soft);border-color:transparent}
.sheet.bad{background:var(--red-soft);border-color:transparent}
.sheet .msg{font-weight:900;font-size:19px;margin:0 0 4px}
.sheet.good .msg{color:var(--green-dark)}.sheet.bad .msg{color:var(--red)}
.sheet .exp{font-size:15px;margin:0 0 12px;max-height:30vh;overflow:auto}
.done-hero{text-align:center;padding:30px 0}
.done-hero .big{font-size:64px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.stats div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{color:var(--muted);font-size:13px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:28px;text-align:center;margin:6px 0 12px}
.timer.over{color:var(--red)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:15px}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--green)}
.search{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin:0 0 12px}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.group{margin:22px 0 8px;font-weight:900}
.cs-item{border-top:2px solid var(--line);padding:12px 0}
.cs-item:first-child{border-top:0}
.cs-q{font-weight:800;margin:0 0 4px}
.lvl{font-size:12px;font-weight:800;color:var(--muted);margin-left:6px}
.back{background:none;border:0;color:var(--blue);font-weight:800;padding:8px 0;margin:0 0 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.qtext{font-size:19px}.pairs .opt{font-size:13.5px}}
#ians,#ans{scroll-margin-top:72px}

/* ---- v2 ---- */
.hero-actions{display:grid;grid-template-columns:1fr;gap:10px;margin:0 0 14px}
.btn.big{padding:18px 16px;font-size:18px}
.btn .s{display:block;font-weight:700;font-size:13px;opacity:.9;letter-spacing:0;margin-top:2px}
.stack{display:flex;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.stack i{display:block;height:100%}
.stack .m{background:var(--green)}.stack .k{background:#8FD3A4}.stack .s{background:var(--amber)}
:root[data-theme="dark"] .stack .k{background:#2F6B44}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stack .k{background:#2F6B44}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:6px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.input{width:100%;font:inherit;font-size:18px;padding:14px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink);outline:none}
.input:focus{border-color:var(--blue)}
.input.ok{border-color:var(--green);background:var(--green-soft)}
.input.bad{border-color:var(--red);background:var(--red-soft)}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:800;padding:10px 0;font-size:15px}
.opt.multi{display:flex;gap:10px;align-items:flex-start}
.opt.multi::before{content:"";flex:0 0 20px;height:20px;border:2px solid var(--line);border-radius:6px;margin-top:1px;background:var(--surface)}
.opt.multi.sel::before{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 3px var(--surface)}
.opt.multi.ok::before{background:var(--green);border-color:var(--green)}
.opt.multi.bad::before{background:var(--red);border-color:var(--red)}
.opt.multi.missed{border-color:var(--green);border-style:dashed}
.defbox{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 14px;font-size:18px;line-height:1.5}
.clock{font-variant-numeric:tabular-nums;font-weight:900;color:var(--muted);font-size:15px;min-width:48px;text-align:right}
.clock.low{color:var(--red)}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:800;color:var(--muted)}
.tabs button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.gl{display:grid;grid-template-columns:minmax(0,38%) 1fr;gap:4px 12px;padding:8px 0;border-top:2px solid var(--line);font-size:15px}
.gl:first-of-type{border-top:0}
.gl b{font-weight:800}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 18px}
.pgrid div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px}
.pgrid b{display:block;font-size:24px;font-weight:900}
.pgrid span{color:var(--muted);font-size:13px}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;margin:6px 0 4px}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week .b{width:100%;background:var(--amber);border-radius:6px 6px 0 0;min-height:2px}
.week .d{font-size:12px;color:var(--muted)}
.week .v{font-size:11px;color:var(--muted);font-weight:700}
.urow{padding:12px 0;border-top:2px solid var(--line)}
.urow:first-child{border-top:0}
.urow .h{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.urow .n{color:var(--muted);font-size:13px;margin-top:2px}
.mini{font-size:13px;color:var(--muted);font-weight:700}

</style>
</head>

<script>

  { id: 9,  icon: "🗓️", title: "Airflow и батч",          tag: "E-com" },

  a: "Narrow — каждая выходная партиция зависит от одной входной: select, filter, withColumn, union. Они идут в одной стадии без пересылки данных. Wide — выходная партиция собирается из многих входных: groupBy, join без broadcast, distinct, orderBy, repartition. Для них нужен шаффл: executors пишут данные на диск по ключу и обмениваются ими по сети.",

  a: "Broadcast hash join — маленькая сторона меньше порога `spark.sql.autoBroadcastJoinThreshold` (по умолчанию 10 МБ) копируется на все executors, большая не шаффлится. Sort-merge join — по умолчанию для двух больших таблиц: обе стороны шаффлятся и сортируются по ключу. Shuffle hash join — шаффл без сортировки. Для неравенств — broadcast nested loop, крайний случай — декартово произведение.",

{ id: "s7-4",
  u: 7,
  l: 3,
  q: "Как в ClickHouse обновлять и удалять данные и почему это дорого?",
  a: "ALTER TABLE … UPDATE и DELETE — мутации: асинхронно переписывают все затронутые части целиком, поэтому тяжёлые и не для частого использования. Lightweight DELETE (DELETE FROM) помечает строки маской, а физически удаляет при слиянии — дешевле, но тоже не для потоковых изменений. Правильный подход — проектировать под вставки: ReplacingMergeTree с версией или Collapsing-движки, а удаление старого — через TTL и DROP PARTITION.",
  m: "Мутации видны в system.mutations; зависшая мутация блокирует слияния.",
  k: ["мутации переписывают части","lightweight DELETE — маска","проектировать под вставки","TTL и DROP PARTITION"],
  mc: {"q":"Как правильно «обновлять» строку витрины в ClickHouse?","ok":"Вставить новую версию в ReplacingMergeTree","no":["ALTER TABLE UPDATE на каждое изменение","DELETE и INSERT в одной транзакции"]},
  w: ["мутации","DROP PARTITION"] },
{ id: "s7-5",
  u: 7,
  l: 3,
  q: "Что делает FINAL и как с ним жить?",
  a: "FINAL выполняет схлопывание Replacing- или Collapsing-движка во время запроса, поэтому результат корректен ещё до фонового слияния. Цена — дополнительная работа при чтении. Смягчают так: читать с FINAL только нужный диапазон, включить do_not_merge_across_partitions_select_final, когда ключ партиции согласован с ключом сортировки, или вместо FINAL писать запрос с argMax и GROUP BY.",
  m: "OPTIMIZE TABLE … FINAL принудительно сливает части — тяжёлая операция, не для регулярного использования. У нас витрины небольшие, FINAL на них приемлем.",
  k: ["схлопывание при чтении","дороже запрос","do_not_merge_across_partitions_select_final","argMax вместо FINAL","OPTIMIZE FINAL — тяжело"],
  mc: {"q":"Чем можно заменить FINAL для текущего статуса?","ok":"argMax(status, event_ts) с GROUP BY","no":["ORDER BY event_ts DESC LIMIT 1 без группировки","uniq(status)"]},
  w: ["FINAL","argMax"] },
{ id: "s7-6",
  u: 7,
  l: 3,
  q: "Как устроены распределённые таблицы и репликация?",
  a: "Шардирование: на каждом шарде локальная таблица, а Distributed-таблица поверх рассылает запрос на все шарды и собирает результат. Ключ шардирования, например cityHash64(order_id), решает, на какой шард пойдёт строка. Репликация — Replicated*MergeTree: реплики шарда синхронизируются через ClickHouse Keeper. DDL на весь кластер — ON CLUSTER.",
  m: "Тонкость: JOIN и IN по Distributed-таблицам выполняются на каждом шарде; для распределённой правой стороны нужен GLOBAL. Кластер у нас держала платформа, я создавала таблицы домена.",
  k: ["локальные таблицы на шардах","Distributed поверх","ключ шардирования","Replicated + Keeper","ON CLUSTER, GLOBAL"],
  mc: {"q":"Через что синхронизируются реплики?","ok":"ClickHouse Keeper или ZooKeeper","no":["Kafka","Distributed-таблицу"]},
  w: ["Keeper","Distributed"] },
{ id: "s7-7",
  u: 7,
  l: 3,
  q: "Что такое индексы пропуска данных и PREWHERE?",
  a: "Skip-индексы хранят сводку по группам гранул и позволяют пропускать их: minmax — минимум и максимум, set — набор значений, bloom_filter и tokenbf — для поиска по редким значениям и словам. Помогают только если данные коррелируют с индексом. PREWHERE сначала читает колонки фильтра и только для подходящих строк — остальные; ClickHouse применяет его автоматически.",
  m: "Для поиска по order_id в таблице, отсортированной по дате и даркстору, лучше подошла projection, чем bloom_filter.",
  k: ["minmax, set, bloom_filter","пропуск гранул","нужна корреляция","PREWHERE — сначала фильтр","автоматически"],
  mc: {"q":"Какой skip-индекс подходит для поиска по редкому значению?","ok":"bloom_filter","no":["minmax по случайному полю","LowCardinality"]},
  w: ["bloom_filter","PREWHERE"] },
{ id: "s7-8",
  u: 7,
  l: 3,
  q: "Как работает JOIN в ClickHouse и как его не уронить?",
  a: "По умолчанию hash join: правая таблица целиком загружается в память, левая читается потоком. Поэтому маленькая таблица — справа. Для больших правых таблиц есть grace_hash и partial_merge, которые сбрасывают данные на диск. Для справочников лучше словари и dictGet: справочник держится в памяти и обновляется по расписанию.",
  m: "Чаще всего в ClickHouse лучше денормализовать витрину заранее, чем джойнить большие таблицы в запросе дашборда.",
  k: ["hash join — правая в памяти","маленькая справа","grace_hash, partial_merge","словари и dictGet","денормализация"],
  mc: {"q":"Какую таблицу ставить справа в JOIN?","ok":"Меньшую","no":["Большую","Без разницы"]},
  w: ["dictGet","справа"] },
{ id: "s7-9",
  u: 7,
  l: 3,
  q: "Как ClickHouse дедуплицирует вставки и что такое async insert?",
  a: "Replicated-таблицы запоминают хэши последних вставленных блоков и отбрасывают повтор такого же блока — это защищает от ретрая той же вставки. Для обычного MergeTree это включается окном non_replicated_deduplication_window, а точнее управлять можно через insert_deduplication_token. async_insert копит мелкие вставки на сервере и пишет их пачкой — спасает от Too many parts, когда клиент не умеет батчить.",
  m: "Дедуп блоков работает, только если повторный блок совпадает побайтно. После повтора батча Spark с новым ingested_at блоки разные, поэтому у нас дубли схлопывал ReplacingMergeTree.",
  k: ["хэши последних блоков","Replicated — по умолчанию","insert_deduplication_token","async_insert против мелких вставок"],
  mc: {"q":"Почему дедуп блоков не спас от повтора батча Spark?","ok":"У повтора другой ingested_at, блоки не совпадают","no":["ClickHouse не умеет дедуплицировать вставки","Spark пишет через Kafka"]},
  w: ["async_insert","insert_deduplication_token"] },

{ id: "u4-6",
  u: 8,
  l: 3,
  q: "Почему ReplacingMergeTree и в чём его подвох?",
  a: "ReplacingMergeTree при фоновом слиянии частей оставляет одну строку на ключ сортировки — с максимальной версией. Это делает повторные вставки безопасными. Подвох: слияние асинхронное и только внутри партиции, поэтому до слияния в таблице видны обе версии. Корректность обеспечивают на чтении: `FINAL` или `argMax`.",
  m: "Ключ дедупа — это ORDER BY, поэтому в таблице событий в него входил event_id. Копии одного события всегда в одной партиции, потому что у них одинаковая дата.",
  k: ["одна строка на ключ при слиянии","версия — max","слияние асинхронное, внутри партиции","FINAL или argMax на чтении"],
  mc: {"q":"Почему в ClickHouse видны дубли при ReplacingMergeTree?","ok":"Слияние частей асинхронное и ещё не прошло","no":["Движок не схлопывает строки с одинаковым ключом","Дубли попали в разные таблицы"]},
  w: ["FINAL","argMax"] },

{ id: "u4-8",

  a: "Это триггер на вставку: каждый раз, когда стрим вставляет пачку в `order_events`, ClickHouse прогоняет её через запрос представления и дописывает результат в таблицу `store_hourly_agg` на AggregatingMergeTree. Само представление данных не хранит. В таблице лежат промежуточные состояния агрегатов, дашборд читает их через `uniqExactMerge` и `sumMerge`.",

  k: ["триггер на вставку","данные в store_hourly_agg","AggregatingMergeTree, состояния агрегатов","видит только пачку"],

{ id: "u4-9",
  u: 8,
  l: 3,
  q: "Зачем две почасовые таблицы — store_hourly_agg и orders_hourly?",
  a: "Материализованное представление видит только вставленную пачку и умеет простые счётчики: заказы, отмены, сумму — зато мгновенно. `orders_hourly` раз в час считает SQL из DAG, который видит все события заказа сразу, поэтому умеет время сборки, время доставки и долю опозданий. Каждый запуск пересчитывает два часа, чтобы учесть поздние события.",

  mc: {"q":"Какая материализация не создаёт объект в базе?","ok":"ephemeral","no":["view","table"]},
  w: ["ephemeral","incremental"] },
{ id: "s14-3",
  u: 14,
  l: 3,
  q: "Как работали инкрементальные модели на Greenplum?",
  a: "Модель с materialized='incremental' при первом запуске строит таблицу целиком, а дальше `is_incremental()` возвращает true, и в запрос добавляется фильтр по окну. Стратегия — delete+insert с unique_key: dbt удаляет строки с ключами из новой порции и вставляет порцию. MERGE в Greenplum нет. Окно брали с запасом на проводки задним числом, пересборку целиком делали через --full-refresh.",
  m: "on_schema_change='append_new_columns' — чтобы новая колонка не ломала модель. {{ this }} — ссылка на текущую таблицу модели.",
  k: ["is_incremental()","фильтр по окну","delete+insert с unique_key","без MERGE","--full-refresh"],
  mc: {"q":"Какая стратегия инкремента подходит для Greenplum?","ok":"delete+insert","no":["merge","insert_overwrite"]},
  o: ["Первый запуск строит таблицу целиком","Дальше is_incremental() = true","Запрос берёт окно новых данных","delete удаляет строки с теми же ключами","insert вставляет порцию"],
  c: `{{ config(
    materialized='incremental',
    incremental_strategy='delete+insert',
    unique_key='transaction_id',
    distributed_by='account_id',
    appendoptimized=true, orientation='column', compresstype='zstd'
) }}
select t.*, c.segment
from {{ ref('dds_transactions') }} t
join {{ ref('dds_client_hist') }} c
  on c.client_sk = t.client_sk
 and t.operation_date between c.dbt_valid_from and coalesce(c.dbt_valid_to, '9999-12-31')
{% if is_incremental() %}
where t.operation_date >= (select max(operation_date) - 10 from {{ this }})
{% endif %}`,
  w: ["is_incremental","unique_key"] },

  m: "Стратегия timestamp подходит, когда источник надёжно ведёт updated_at; в CRM ему не доверяли, поэтому check. Целостность истории проверяли тестом mutually_exclusive_ranges из dbt_utils.",
  k: ["dbt snapshot, стратегия check","dbt_valid_from и dbt_valid_to","под капотом UPDATE + INSERT, без MERGE","большие истории — свой макрос с EXCHANGE PARTITION","проверка mutually_exclusive_ranges"],

  mc: {"q":"Что делает dbt snapshot на Greenplum вместо MERGE?","ok":"UPDATE закрывает старые версии и INSERT вставляет новые","no":["Пересоздаёт таблицу целиком","Пишет изменения в отдельный лог без закрытия версий"]},
  o: ["Snapshot читает текущее состояние из STG","Сравнивает отслеживаемые колонки с текущими версиями","UPDATE закрывает изменившиеся версии: dbt_valid_to","INSERT добавляет новые версии","Тест mutually_exclusive_ranges проверяет интервалы"],

{ id: "u11-1",

</script>
<script>
(() => {
  "use strict";

  const UNITS = window.UNITS;
  const QA = window.Q;
  const DR = window.D;
  const FIELDS = window.PROFILE_FIELDS;
  const KEY = "interview-trainer-v2";
  const OLD_KEY = "interview-trainer-v1";
  const DAY = 864e5;
  const INTERVALS = [0, 1, 2, 4, 7, 14];
  const GOAL = 60;
  const MIX_MINUTES = 15;
  const app = document.getElementById("app");

  // ---------- идентификаторы упражнений ----------
  function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  const usedIds = new Set();
  DR.forEach((d) => {
    let id = "d" + d.u + "-" + hash(d.t + "|" + (d.term || d.q || d.x));
    while (usedIds.has(id)) id += "x";
    usedIds.add(id); d.id = id;
  });
  const ITEMS = QA.map((q) => ({ kind: "qa", id: q.id, u: q.u, ref: q })).concat(DR.map((d) => ({ kind: "dr", id: d.id, u: d.u, ref: d })));
  const itemsOf = (u) => ITEMS.filter((i) => i.u === u);
  const unitById = (u) => UNITS.find((x) => x.id === u);

  // ---------- состояние ----------
  function read(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  let S = read(KEY);
  if (!S) {
    const old = read(OLD_KEY) || {};
    S = { xp: old.xp || 0, streak: old.streak || 0, last: old.last || null, day: old.day || null, dayXp: old.dayXp || 0,
          hist: {}, cards: old.cards || {}, profile: old.profile || {}, tipHidden: !!old.tipHidden };
  }
  S = Object.assign({ xp: 0, streak: 0, last: null, day: null, dayXp: 0, hist: {}, cards: {}, profile: {}, tipHidden: false }, S);
  let storageOk = true;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; }
  }
  save();

  function localDay(d) { const x = d || new Date(); return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  const dayAgo = (n) => localDay(new Date(Date.now() - n * DAY));
  function addXp(n) {
    const t = localDay();
    if (S.day !== t) { S.day = t; S.dayXp = 0; }
    if (S.last !== t) { S.streak = S.last === dayAgo(1) ? S.streak + 1 : 1; S.last = t; }
    S.xp += n; S.dayXp += n;
    S.hist[t] = (S.hist[t] || 0) + n;
    const cutoff = dayAgo(40);
    Object.keys(S.hist).forEach((d) => { if (d < cutoff) delete S.hist[d]; });
    save();
  }

  const getC = (id) => S.cards[id] || { box: 0, due: 0, seen: false, ok: 0, bad: 0 };
  function grade(id, result) {
    const c = S.cards[id] || (S.cards[id] = { box: 0, due: 0, seen: false, ok: 0, bad: 0 });
    c.seen = true;
    if (result === "good") { c.box = Math.min(5, c.box + 1); c.ok = (c.ok || 0) + 1; }
    else if (result === "ok") { c.box = Math.max(1, c.box); c.ok = (c.ok || 0) + 1; }
    else { c.box = 0; c.bad = (c.bad || 0) + 1; }
    c.due = Date.now() + INTERVALS[c.box] * DAY;
    save();
  }
  const isWeak = (id) => { const c = S.cards[id]; return !!c && c.seen && (c.box === 0 || c.due <= Date.now()); };
  function stats(items) {
    let seen = 0, known = 0, mastered = 0, ok = 0, bad = 0, weak = 0;
    items.forEach((i) => {
      const c = getC(i.id);
      if (c.seen) seen++;
      if (c.seen && c.box >= 1) known++;
      if (c.box >= 3) mastered++;
      if (isWeak(i.id)) weak++;
      ok += c.ok || 0; bad += c.bad || 0;
    });
    return { total: items.length, seen, known, mastered, weak, ok, bad, acc: ok + bad ? Math.round(ok / (ok + bad) * 100) : null };
  }

  // ---------- текст ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  function pval(k) {
    const f = FIELDS.find((x) => x.key === k);
    const v = S.profile[k];
    return (v !== undefined && String(v).trim() !== "") ? String(v) : (f ? f.def : k);
  }
  const res = (s) => String(s).replace(/⟨([a-z_]+)⟩/g, (m, k) => pval(k));
  function rich(text) {
    let h = esc(text);
    h = h.replace(/`([^`]+)`/g, (m, c) => "<code>" + c + "</code>");
    h = h.replace(/⟨([a-z_]+)⟩/g, (m, k) => '<mark class="ph" title="Из профиля — можно поменять">' + esc(pval(k)) + "</mark>");
    h = h.replace(/⟪BLANK⟫/g, '<span class="blank">?</span>');
    return h;
  }
  const plain = (text) => res(text).replace(/`/g, "");
  function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  const uniq = (a) => [...new Set(a)];

  // проверка вписанного ответа: регистр, пробелы, пунктуация и одна-две опечатки не важны
  const norm = (s) => res(s).toLowerCase().replace(/ё/g, "е").replace(/[\s_\-.,;:!?()'"«»`{}[\]=+/\\*%]/g, "");
  function lev(a, b) {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function checkTyped(input, answers) {
    const x = norm(input);
    if (!x) return "bad";
    for (const a of answers) { if (norm(a) === x) return "exact"; }
    for (const a of answers) {
      const y = norm(a); const d = lev(x, y);
      if ((y.length >= 12 && d <= 2) || (y.length >= 5 && d <= 1)) return "close";
    }
    return "bad";
  }

  // ---------- пулы для отвлекающих вариантов ----------
  const defsOf = (u) => DR.filter((d) => d.t === "def" && (u === undefined || d.u === u));
  function shortAnswers(u) {
    const list = [];
    DR.forEach((d) => {
      if (u !== undefined && d.u !== u) return;
      if (d.t === "def") list.push(d.term);
      if (d.t === "type") list.push(res(d.a[0]));
      if (d.t === "gap") { const m = d.x.match(/⟦(.+?)⟧/); if (m) list.push(res(m[1])); }
    });
    QA.forEach((q) => { if ((u === undefined || q.u === u) && q.w) list.push(...q.w); });
    return uniq(list.filter((s) => s && s.length <= 40));
  }
  function distract(u, right, n, pool) {
    const r = norm(right);
    let out = shuffle(uniq((pool || shortAnswers(u)).filter((x) => norm(x) !== r))).slice(0, n);
    if (out.length < n) out = out.concat(shuffle(uniq(shortAnswers().filter((x) => norm(x) !== r && !out.includes(x)))).slice(0, n - out.length));
    return out;
  }

  // ---------- каркас ----------
  let sheetEl = null;
  function clearSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
  function view(html) { clearSheet(); app.innerHTML = html; window.scrollTo(0, 0); }
  function sheet(cls, inner, buttons) {
    clearSheet();
    sheetEl = document.createElement("div");
    sheetEl.className = "sheet " + (cls || "");
    sheetEl.innerHTML = '<div class="in" aria-live="polite">' + inner + buttons + "</div>";
    document.body.appendChild(sheetEl);
  }
  function setCheck(on) { const b = sheetEl && sheetEl.querySelector('[data-act="check"]'); if (b) b.disabled = !on; }

  function topbar() {
    const t = localDay();
    const dx = S.day === t ? S.dayXp : 0;
    const st = (S.last === t || S.last === dayAgo(1)) ? S.streak : 0;
    const all = stats(ITEMS);
    return '<div class="top"><span class="stat" title="Дней подряд">🔥 ' + st + '</span><span class="stat" title="Опыт">⭐ ' + S.xp +
      '</span><div class="goal" title="Цель дня: ' + GOAL + ' опыта"><i style="width:' + Math.min(100, dx / GOAL * 100) + '%"></i></div>' +
      '<span class="stat" title="Пройдено упражнений">📈 ' + Math.round(all.seen / all.total * 100) + "%</span></div>";
  }
  function stackBar(s) {
    const w = (n) => (n / s.total * 100).toFixed(1) + "%";
    return '<div class="stack"><i class="m" style="width:' + w(s.mastered) + '"></i><i class="k" style="width:' + w(s.known - s.mastered) +
      '"></i><i class="s" style="width:' + w(s.seen - s.known) + '"></i></div>';
  }
  const legend = '<div class="legend"><span><i style="background:var(--green)"></i>освоено</span><span><i style="background:#8FD3A4"></i>знаю</span><span><i style="background:var(--amber)"></i>ошибки, повторить</span></div>';

  // ---------- главная ----------
  function home() {
    const weak = stats(ITEMS).weak;
    let rec = UNITS.find((u) => { const s = stats(itemsOf(u.id)); return s.seen < s.total; }) || UNITS[0];
    const tip = S.tipHidden ? "" :
      '<div class="tip">Числа и названия, выделенные <mark class="ph">так</mark>, подставляются из профиля. Сейчас там значения из модели проекта — поменяй их на свои, чтобы репетировать свою историю.<br>' +
      '<button data-go="profile">Открыть профиль</button><button data-act="hideTip">Понятно</button></div>';
    const warn = storageOk ? "" : '<div class="tip" style="background:var(--red-soft)">Браузер не даёт сохранять прогресс на этом сайте — он сбросится после закрытия вкладки. Проверь, не открыт ли режим инкогнито.</div>';
    const units = UNITS.map((u) => {
      const s = stats(itemsOf(u.id));
      return '<button class="unit' + (u === rec ? " rec" : "") + '" data-unit="' + u.id + '"><span class="ic">' + u.icon + "</span><span>" +
        '<span class="t">' + u.id + ". " + esc(u.title) + '</span><span class="tag">' + esc(u.tag) + "</span>" +
        '<div class="p">пройдено ' + s.seen + " из " + s.total + " · знаю " + s.known + (s.acc !== null ? " · точность " + s.acc + "%" : "") +
        (u === rec ? " · дальше сюда" : "") + "</div>" + stackBar(s) + "</span></button>";
    }).join("");
    view('<div class="wrap">' + topbar() + "<h1>Собеседование: мой опыт</h1>" +
      '<p class="sub">' + QA.length + " вопросов и " + DR.length + " упражнений по двум проектам, Spark, ClickHouse и dbt.</p>" + warn + tip +
      '<div class="hero-actions"><button class="btn big" data-go="mix">🎲 Случайный урок на ' + MIX_MINUTES + ' минут<span class="s">упражнения из всех разделов, слабые места в приоритете</span></button></div>' +
      '<div class="actions">' +
      '<button class="tile" data-go="review"><b>🔁 Слабые места</b><span>' + (weak ? weak + " на повторение" : "пока нет") + "</span></button>" +
      '<button class="tile" data-go="interview"><b>🎙️ Собеседование</b><span>10 вопросов с таймером</span></button>' +
      '<button class="tile" data-go="progress"><b>📈 Прогресс</b><span>по темам и дням</span></button>' +
      '<button class="tile" data-go="cheat"><b>📄 Шпаргалка</b><span>ответы и определения</span></button>' +
      "</div><h2>Разделы</h2>" + legend + '<div class="path">' + units + '</div><div style="height:16px"></div>' +
      '<button class="btn ghost" data-go="profile">⚙️ Профиль: мои числа и названия</button></div>');
  }

  // ---------- построение упражнений ----------
  function pickMixed(pool, n, weakShare) {
    const weak = shuffle(pool.filter((i) => isWeak(i.id)));
    const unseen = pool.filter((i) => !getC(i.id).seen);
    const rest = shuffle(pool.filter((i) => getC(i.id).seen && !isWeak(i.id))).sort((a, b) => getC(a.id).box - getC(b.id).box);
    const out = [];
    const take = (arr, k) => { for (const x of arr) { if (out.length >= k) break; if (!out.includes(x)) out.push(x); } };
    take(weak, Math.ceil(n * weakShare));
    take(unseen, n);
    take(weak, n);
    take(rest, n);
    return out.slice(0, n);
  }

  function qaPractice(q) {
    const opts = [];
    if (q.mc) opts.push(() => ({ type: "choice", id: q.id, kind: "Выбери верный ответ", prompt: rich(q.mc.q || q.q),
      opts: shuffle([q.mc.ok].concat(q.mc.no)), right: q.mc.ok, rich: true, explain: rich(q.a) }));
    if (q.w) opts.push(() => {
      for (const t of shuffle(q.w)) {
        for (const src of [q.a, q.m || ""]) {
          const i = src.toLowerCase().indexOf(t.toLowerCase());
          if (i < 0) continue;
          const term = src.substr(i, t.length);
          const text = src.slice(0, i) + "⟪BLANK⟫" + src.slice(i + t.length);
          if (Math.random() < 0.55) return { type: "input", passage: true, id: q.id, kind: "Впиши пропущенное", sub: esc(plain(q.q)), prompt: rich(text), answers: [term], show: term, explain: rich(q.a) };
          return { type: "choice", passage: true, id: q.id, kind: "Вставь пропущенное", sub: esc(plain(q.q)), prompt: rich(text), opts: shuffle([term].concat(distract(q.u, term, 2))), right: term, explain: rich(q.a) };
        }
      }
      return null;
    });
    if (q.o) opts.push(() => ({ type: "order", id: q.id, kind: "Расставь по порядку", prompt: rich(q.q), steps: q.o }));
    if (q.f) opts.push(() => ({ type: "follow", id: q.id, q }));
    for (const f of shuffle(opts)) { const s = f(); if (s) return s; }
    return { type: "flash", id: q.id, q };
  }

  function drillStep(d) {
    if (d.t === "def") {
      const r = Math.random();
      const unitDefs = defsOf(d.u).filter((x) => x !== d);
      const pool = unitDefs.length >= 2 ? unitDefs : defsOf().filter((x) => x !== d);
      if (r < 0.4) return { type: "input", id: d.id, kind: "Как это называется?", prompt: '<div class="defbox">' + rich(d.d) + "</div>", answers: [d.term].concat(d.alt || []), show: d.term };
      if (r < 0.7) return { type: "choice", id: d.id, kind: "Выбери термин", prompt: '<div class="defbox">' + rich(d.d) + "</div>",
        opts: shuffle([d.term].concat(shuffle(pool).slice(0, 2).map((x) => x.term))), right: d.term };
      return { type: "choice", id: d.id, kind: "Что это значит?", prompt: rich(d.term), opts: shuffle([d.d].concat(shuffle(pool).slice(0, 2).map((x) => x.d))), right: d.d, rich: true };
    }
    if (d.t === "mc") return { type: "choice", id: d.id, kind: "Выбери верный ответ", prompt: rich(d.q), opts: shuffle([d.ok].concat(d.no)), right: d.ok, rich: true };
    if (d.t === "multi") return { type: "multi", id: d.id, kind: "Выбери все верные", prompt: rich(d.q), ok: d.ok, opts: shuffle(d.ok.concat(d.no)) };
    if (d.t === "ord") return { type: "order", id: d.id, kind: "Расставь по порядку", prompt: rich(d.q), steps: d.s };
    if (d.t === "type") return { type: "input", id: d.id, kind: "Впиши ответ", prompt: rich(d.q), answers: d.a, show: res(d.a[0]) };
    if (d.t === "gap") {
      const m = d.x.match(/⟦(.+?)⟧/);
      const ans = res(m[1]);
      const text = rich(d.x.replace(m[0], "⟪BLANK⟫"));
      if (ans.length <= 28 && Math.random() < 0.65) return { type: "input", passage: true, id: d.id, kind: "Впиши пропущенное", prompt: text, answers: [m[1]].concat(d.a || []), show: ans };
      return { type: "choice", passage: true, id: d.id, kind: "Вставь пропущенное", prompt: text, opts: shuffle([ans].concat(distract(d.u, ans, 2))), right: ans };
    }
    return null;
  }

  function pairsStep(u) {
    let list = defsOf(u).map((d) => [d.term, d.d]);
    if (list.length < 4 && u !== undefined && unitById(u).pairs) list = unitById(u).pairs;
    if (list.length < 4) return null;
    const ps = shuffle(list).slice(0, 4);
    return { type: "pairs", ps };
  }

  // ---------- уроки ----------
  let L = null;
  const cur = () => L.steps[L.i];
  function stepsFor(items, withFlash) {
    const flashes = [], practice = [];
    let fc = 0;
    items.forEach((it) => {
      if (it.kind === "qa") {
        if (withFlash && !getC(it.id).seen && fc < 2) { flashes.push({ type: "flash", id: it.id, q: it.ref }); fc++; }
        practice.push(qaPractice(it.ref));
      } else {
        const s = drillStep(it.ref); if (s) practice.push(s);
      }
    });
    return flashes.concat(shuffle(practice));
  }
  function startUnit(uid) {
    const pool = itemsOf(uid);
    const qa = pickMixed(pool.filter((i) => i.kind === "qa"), 3, 0.3);
    const dr = pickMixed(pool.filter((i) => i.kind === "dr"), 10, 0.3);
    const steps = stepsFor(qa.concat(dr), true);
    const p = pairsStep(uid); if (p) steps.splice(Math.min(steps.length, 6), 0, p);
    const u = unitById(uid);
    begin(steps, u.icon + " " + u.title, { unit: uid });
  }
  function startMix() {
    const qa = pickMixed(ITEMS.filter((i) => i.kind === "qa"), 5, 0.4);
    const dr = pickMixed(ITEMS.filter((i) => i.kind === "dr"), 18, 0.4);
    const steps = stepsFor(qa.concat(dr), false);
    const units = shuffle(UNITS.filter((u) => defsOf(u.id).length >= 4));
    const p = units.length ? pairsStep(units[0].id) : null;
    if (p) steps.splice(Math.floor(steps.length / 2), 0, p);
    begin(steps, "🎲 Случайный урок", { deadline: Date.now() + MIX_MINUTES * 60000 });
  }
  function startReview() {
    let pool = ITEMS.filter((i) => isWeak(i.id));
    if (!pool.length) pool = ITEMS.filter((i) => getC(i.id).seen).sort((a, b) => getC(a.id).box - getC(b.id).box).slice(0, 15);
    if (!pool.length) {
      view('<div class="wrap"><button class="back" data-go="home">← Назад</button><h1>Пока нечего повторять</h1><p class="sub">Пройди пару уроков — сюда попадут упражнения с ошибками и те, что пора повторить.</p></div>');
      return;
    }
    begin(stepsFor(shuffle(pool).slice(0, 15), false), "🔁 Слабые места", {});
  }

  let clockTimer = null;
  function begin(steps, title, opts) {
    L = Object.assign({ steps, i: 0, correct: 0, graded: 0, xp: 0, title, gradedIds: new Set(), misses: [] }, opts);
    if (clockTimer) clearInterval(clockTimer);
    if (L.deadline) clockTimer = setInterval(tickClock, 1000);
    step();
  }
  function clockText() {
    const left = Math.max(0, Math.round((L.deadline - Date.now()) / 1000));
    return Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  }
  function tickClock() {
    const el = document.getElementById("clock");
    if (!el || !L || !L.deadline) return;
    el.textContent = clockText();
    el.classList.toggle("low", L.deadline - Date.now() < 60000);
  }
  function step() {
    if (L.i >= L.steps.length || (L.deadline && Date.now() > L.deadline)) { finish(); return; }
    const s = cur();
    const head = '<div class="wrap"><div class="lessonbar"><button class="x" data-act="quit" aria-label="Выйти">×</button>' +
      '<div class="prog"><i style="width:' + (L.i / L.steps.length * 100) + '%"></i></div>' +
      (L.deadline ? '<span class="clock" id="clock">' + clockText() + "</span>" : "") + "</div>";
    ({ flash: rFlash, choice: rChoice, multi: rMulti, order: rOrder, input: rInput, pairs: rPairs, follow: rFollow })[s.type](s, head);
  }
  function give(n) { L.xp += n; addXp(n); }
  function record(s, ok) {
    if (!s.id) return;
    if (!ok) { grade(s.id, "bad"); L.misses.push(s); }
    else if (!L.gradedIds.has(s.id)) grade(s.id, "good");
    L.gradedIds.add(s.id);
  }
  function result(s, ok, html, close) {
    L.graded++; if (ok) L.correct++;
    record(s, ok);
    give(ok ? (s.type === "input" || s.type === "multi" ? 12 : 10) : 2);
    sheet(ok ? "good" : "bad", '<p class="msg">' + (ok ? (close ? "Засчитано, но проверь написание" : "Верно!") : "Не совсем") + '</p><div class="exp">' + (html || "") + "</div>",
      '<button class="btn' + (ok ? "" : " red") + '" data-act="next">Дальше</button>');
  }
  function next() { L.i++; step(); }

  function answerBlock(q) {
    let more = "";
    if (q.m || q.c || q.t) {
      more = "<details><summary>Подробнее</summary>" + (q.m ? "<p>" + rich(q.m) + "</p>" : "") +
        (q.c ? "<pre><code>" + esc(q.c) + "</code></pre>" : "") + (q.t ? '<div class="trap">⚠️ ' + rich(q.t) + "</div>" : "") + "</details>";
    }
    return '<div class="answer">' + rich(q.a) + '<ul class="keys">' + q.k.map((k) => "<li>" + rich(k) + "</li>").join("") + "</ul>" + more + "</div>";
  }

  // Новый вопрос: прочитать эталонный ответ (не больше двух на урок)
  function rFlash(s, head) {
    view(head + '<p class="kind">Новый вопрос — попробуй ответить вслух</p><p class="qtext">' + rich(s.q.q) + '</p><div id="ans"></div></div>');
    sheet("", "", '<button class="btn" data-act="reveal">Показать ответ</button>');
  }
  function revealFlash() {
    document.getElementById("ans").innerHTML = answerBlock(cur().q);
    sheet("", '<p class="hint" style="margin:0 0 10px">Насколько близко ты ответила?</p>',
      '<div class="row"><button class="btn red" data-rate="bad">Не знаю</button><button class="btn amber" data-rate="ok">Почти</button><button class="btn" data-rate="good">Знаю</button></div>');
  }
  function rate(r) {
    const s = cur();
    grade(s.id, r); L.gradedIds.add(s.id);
    give(r === "good" ? 8 : r === "ok" ? 5 : 2);
    next();
  }

  // Выбор одного варианта
  function rChoice(s, head) {
    s.sel = null; s.checked = false;
    view(head + '<p class="kind">' + esc(s.kind) + "</p>" + (s.sub ? '<p class="hint">' + s.sub + "</p>" : "") +
      (s.passage ? '<div class="answer cloze">' + s.prompt + "</div>" : '<div class="qtext">' + s.prompt + "</div>") + '<div class="opts">' +
      s.opts.map((o, i) => '<button class="opt" data-opt="' + i + '">' + (s.rich ? rich(o) : esc(o)) + "</button>").join("") + "</div></div>");
    sheet("", "", '<button class="btn" data-act="check" disabled>Проверить</button>');
  }
  function pickOpt(i, el) {
    const s = cur(); if (s.checked) return;
    if (s.type === "multi") {
      s.sel.has(i) ? s.sel.delete(i) : s.sel.add(i);
      el.classList.toggle("sel");
      setCheck(s.sel.size > 0);
      return;
    }
    s.sel = i;
    app.querySelectorAll(".opt").forEach((b) => b.classList.remove("sel"));
    el.classList.add("sel");
    setCheck(true);
  }

  // Выбор всех верных
  function rMulti(s, head) {
    s.sel = new Set(); s.checked = false;
    view(head + '<p class="kind">' + esc(s.kind) + '</p><div class="qtext">' + s.prompt + '</div><p class="hint">Верных вариантов может быть несколько</p><div class="opts">' +
      s.opts.map((o, i) => '<button class="opt multi" data-opt="' + i + '"><span>' + rich(o) + "</span></button>").join("") + "</div></div>");
    sheet("", "", '<button class="btn" data-act="check" disabled>Проверить</button>');
  }

  // Порядок
  function rOrder(s, head) {
    s.pool = shuffle(s.steps.map((t, i) => ({ t, i }))); s.picked = [];
    view(head + '<p class="kind">' + esc(s.kind) + '</p><div class="qtext">' + s.prompt + '</div><div id="ord"></div></div>');
    sheet("", "", '<button class="btn" data-act="check" disabled>Проверить</button>');
    drawOrder();
  }
  function drawOrder() {
    const s = cur();
    document.getElementById("ord").innerHTML =
      '<div class="order-target">' + s.picked.map((pi, n) => '<button class="chip" data-ou="' + n + '"><span class="n">' + (n + 1) + ".</span> " + rich(s.pool[pi].t) + "</button>").join("") + "</div>" +
      '<div class="opts">' + s.pool.map((it, pi) => s.picked.includes(pi) ? "" : '<button class="chip" data-oi="' + pi + '">' + rich(it.t) + "</button>").join("") + "</div>";
    setCheck(s.picked.length === s.pool.length);
  }

  // Впиши ответ
  function rInput(s, head) {
    s.checked = false;
    view(head + '<p class="kind">' + esc(s.kind) + "</p>" + (s.sub ? '<p class="hint">' + s.sub + "</p>" : "") +
      (s.passage ? '<div class="answer cloze">' + s.prompt + "</div>" : '<div class="qtext">' + s.prompt + "</div>") + '<input class="input" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Твой ответ" aria-label="Твой ответ">' +
      '<button class="linkbtn" data-act="giveup">Не помню — показать ответ</button></div>');
    sheet("", "", '<button class="btn" data-act="check" disabled>Проверить</button>');
    const inp = document.getElementById("typed");
    inp.addEventListener("input", () => setCheck(inp.value.trim().length > 0));
    setTimeout(() => inp.focus(), 50);
  }

  // Пары
  function rPairs(s, head) {
    s.left = shuffle(s.ps.map((p, i) => ({ t: p[0], i }))); s.right = shuffle(s.ps.map((p, i) => ({ t: p[1], i })));
    s.selL = null; s.selR = null; s.done = new Set(); s.miss = 0;
    view(head + '<p class="kind">Найди пары</p><p class="qtext">Соедини термин и его смысл</p><div class="pairs"><div class="col">' +
      s.left.map((x) => '<button class="opt" data-pl="' + x.i + '">' + rich(x.t) + "</button>").join("") + '</div><div class="col">' +
      s.right.map((x) => '<button class="opt" data-pr="' + x.i + '">' + rich(x.t) + "</button>").join("") + "</div></div></div>");
    sheet("", "", '<button class="btn" data-act="pairsDone" disabled>Дальше</button>');
  }
  function pairTap(el) {
    const s = cur();
    const isL = el.dataset.pl !== undefined;
    const i = +(isL ? el.dataset.pl : el.dataset.pr);
    if (s.done.has(i)) return;
    app.querySelectorAll(isL ? "[data-pl]" : "[data-pr]").forEach((b) => b.classList.remove("sel"));
    el.classList.add("sel");
    if (isL) s.selL = i; else s.selR = i;
    if (s.selL === null || s.selR === null) return;
    const l = app.querySelector('[data-pl="' + s.selL + '"]'), r = app.querySelector('[data-pr="' + s.selR + '"]');
    if (s.selL === s.selR) { s.done.add(i); [l, r].forEach((b) => { b.classList.remove("sel"); b.classList.add("done"); b.disabled = true; }); }
    else { s.miss++; [l, r].forEach((b) => { b.classList.remove("sel"); b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 320); }); }
    s.selL = null; s.selR = null;
    if (s.done.size === s.ps.length) { const b = sheetEl.querySelector('[data-act="pairsDone"]'); if (b) b.disabled = false; }
  }

  // Уточняющий вопрос
  function rFollow(s, head) {
    view(head + '<p class="kind">Уточняющий вопрос интервьюера</p><p class="hint">После ответа на «' + esc(plain(s.q.q)) + '» спрашивают:</p><p class="qtext">' +
      rich(s.q.f.q) + '</p><div id="ans"></div></div>');
    sheet("", "", '<button class="btn" data-act="revealFollow">Показать ответ</button>');
  }
  function revealFollow() {
    document.getElementById("ans").innerHTML = '<div class="answer">' + rich(cur().q.f.a) + "</div>";
    sheet("", "", '<div class="row2"><button class="btn red" data-act="followBad">Не справилась</button><button class="btn" data-act="followGood">Справилась</button></div>');
  }

  function check(giveUp) {
    const s = cur();
    if (s.checked) return;
    if (s.type === "choice") {
      if (s.sel === null) return;
      s.checked = true;
      const ok = s.opts[s.sel] === s.right;
      app.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if (s.opts[i] === s.right) b.classList.add("ok"); else if (i === s.sel) b.classList.add("bad"); });
      result(s, ok, (ok ? "" : "<p>Правильно: <b>" + (s.rich ? rich(s.right) : esc(s.right)) + "</b></p>") + (s.explain ? "<p>" + s.explain + "</p>" : ""));
    } else if (s.type === "multi") {
      s.checked = true;
      const okSet = new Set(s.ok);
      let ok = true;
      app.querySelectorAll(".opt").forEach((b, i) => {
        b.disabled = true;
        const isOk = okSet.has(s.opts[i]), chosen = s.sel.has(i);
        if (isOk && chosen) b.classList.add("ok");
        else if (!isOk && chosen) { b.classList.add("bad"); ok = false; }
        else if (isOk && !chosen) { b.classList.add("missed"); ok = false; }
      });
      result(s, ok, ok ? "<p>Все верные выбраны.</p>" : "<p>Верные:</p><ul>" + s.ok.map((x) => "<li>" + rich(x) + "</li>").join("") + "</ul>");
    } else if (s.type === "order") {
      s.checked = true;
      const ok = s.picked.every((pi, n) => s.pool[pi].i === n);
      app.querySelectorAll(".chip").forEach((b) => { b.disabled = true; });
      result(s, ok, ok ? "<p>Последовательность верная.</p>" : "<p>Правильный порядок:</p><ol>" + s.steps.map((t) => "<li>" + rich(t) + "</li>").join("") + "</ol>");
    } else if (s.type === "input") {
      const inp = document.getElementById("typed");
      const v = giveUp ? "" : inp.value;
      if (!giveUp && !v.trim()) return;
      s.checked = true;
      const verdict = giveUp ? "bad" : checkTyped(v, s.answers);
      const ok = verdict !== "bad";
      inp.disabled = true; inp.classList.add(ok ? "ok" : "bad");
      const giveBtn = app.querySelector('[data-act="giveup"]'); if (giveBtn) giveBtn.remove();
      result(s, ok, (verdict === "exact" ? "" : "<p>Ответ: <b>" + esc(s.show) + "</b></p>") + (s.explain ? "<p>" + s.explain + "</p>" : ""), verdict === "close");
    }
  }

  function finish() {
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    const acc = L.graded ? Math.round(L.correct / L.graded * 100) : 100;
    const done = Math.min(L.i, L.steps.length);
    const misses = uniq(L.misses.map((m) => m.id)).slice(0, 6).map((id) => {
      const it = ITEMS.find((x) => x.id === id); const r = it.ref;
      const label = it.kind === "qa" ? r.q : (r.term || r.q || r.x.replace(/⟦(.+?)⟧/, "…"));
      return "<li>" + rich(label) + "</li>";
    }).join("");
    view('<div class="wrap">' + topbar() + '<div class="done-hero"><div class="big">' + (acc >= 80 ? "🎉" : "💪") + "</div><h1>" + (L.deadline && done < L.steps.length ? "Время вышло" : "Урок пройден") +
      '</h1><p class="sub">' + esc(L.title) + " · упражнений: " + done + "</p></div>" +
      '<div class="stats"><div><b>+' + L.xp + "</b><span>опыта</span></div><div><b>" + acc + "%</b><span>точность</span></div><div><b>" + S.streak + "</b><span>дней подряд</span></div></div>" +
      (misses ? '<div class="card" style="margin:0 0 16px"><p class="kind">Подтянуть — уже в «Слабых местах»</p><ul class="keys">' + misses + "</ul></div>" : "") +
      (L.unit ? '<button class="btn" data-unit="' + L.unit + '">Ещё урок по теме</button><div style="height:14px"></div>' : "") +
      (L.deadline ? '<button class="btn" data-go="mix">Ещё 15 минут</button><div style="height:14px"></div>' : "") +
      '<button class="btn ghost" data-go="home">На главную</button></div>');
  }

  // ---------- прогресс ----------
  function progress() {
    const all = stats(ITEMS);
    const days = [];
    for (let i = 6; i >= 0; i--) days.push(dayAgo(i));
    const max = Math.max(10, ...days.map((d) => S.hist[d] || 0));
    const wd = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
    const week = days.map((d) => { const v = S.hist[d] || 0; return '<div class="col"><span class="v">' + (v || "") + '</span><div class="b" style="height:' + (v / max * 80) + 'px"></div><span class="d">' + wd[new Date(d + "T12:00:00").getDay()] + "</span></div>"; }).join("");
    const rows = UNITS.map((u) => ({ u, s: stats(itemsOf(u.id)) }));
    const weakest = rows.filter((r) => r.s.ok + r.s.bad >= 5).sort((a, b) => a.s.acc - b.s.acc).slice(0, 3);
    view('<div class="wrap"><button class="back" data-go="home">← Назад</button><h1>Прогресс</h1>' +
      '<div class="pgrid"><div><b>' + all.seen + " / " + all.total + "</b><span>пройдено упражнений и вопросов</span></div>" +
      "<div><b>" + all.known + "</b><span>знаю — последний ответ верный</span></div>" +
      "<div><b>" + all.mastered + "</b><span>освоено — верно в 3+ сессиях</span></div>" +
      "<div><b>" + (all.acc === null ? "—" : all.acc + "%") + "</b><span>точность за всё время</span></div></div>" +
      '<div class="card" style="margin:0 0 18px"><p class="kind">Опыт за 7 дней · серия ' + S.streak + ' дн.</p><div class="week">' + week + "</div></div>" +
      (weakest.length ? '<div class="card" style="margin:0 0 18px"><p class="kind">Слабые темы</p>' + weakest.map((r) =>
        '<div class="urow"><div class="h"><span>' + r.u.icon + " " + esc(r.u.title) + "</span><span>" + r.s.acc + '%</span></div><button class="linkbtn" data-unit="' + r.u.id + '">Подтянуть →</button></div>').join("") + "</div>" : "") +
      '<div class="card"><p class="kind">По темам</p>' + legend + rows.map((r) =>
        '<div class="urow"><div class="h"><span>' + r.u.icon + " " + esc(r.u.title) + '</span><span class="mini">' + Math.round(r.s.seen / r.s.total * 100) + "%</span></div>" +
        '<div class="n">пройдено ' + r.s.seen + " из " + r.s.total + " · знаю " + r.s.known + " · освоено " + r.s.mastered +
        (r.s.acc !== null ? " · точность " + r.s.acc + "%" : "") + (r.s.weak ? " · повторить " + r.s.weak : "") + "</div>" + stackBar(r.s) +
        '<button class="linkbtn" data-unit="' + r.u.id + '">Урок по теме →</button></div>').join("") + "</div></div>");
  }

  // ---------- собеседование ----------
  let I = null;
  const canRecord = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  function startInterview() {
    const items = ITEMS.filter((i) => i.kind === "qa");
    const weak = shuffle(items.filter((i) => isWeak(i.id))).slice(0, 4);
    const rest = shuffle(items.filter((i) => !weak.includes(i))).slice(0, 10 - weak.length);
    I = { qs: shuffle(weak.concat(rest)).map((i) => i.ref), i: 0, scores: [], timer: null, t0: 0, rec: null, chunks: [], audioUrl: null };
    iStep();
  }
  function stopTimer() { if (I && I.timer) { clearInterval(I.timer); I.timer = null; } }
  function stopRec() { if (I && I.rec && I.rec.state === "recording") I.rec.stop(); }
  function iStep() {
    stopTimer(); stopRec();
    if (I.i >= I.qs.length) { iFinish(); return; }
    if (I.audioUrl) { URL.revokeObjectURL(I.audioUrl); I.audioUrl = null; }
    I.rec = null;
    const q = I.qs[I.i];
    view('<div class="wrap"><div class="lessonbar"><button class="x" data-act="iquit" aria-label="Выйти">×</button><div class="prog"><i style="width:' +
      (I.i / I.qs.length * 100) + '%"></i></div></div><p class="kind">Вопрос ' + (I.i + 1) + " из " + I.qs.length + " · " + esc(unitById(q.u).title) +
      '</p><p class="qtext">' + rich(q.q) + '</p><div class="timer" id="timer">0:00</div><p class="hint" style="text-align:center">Цель — связный ответ за 30–60 секунд</p>' +
      (canRecord() ? '<button class="btn ghost" data-act="rec" id="recbtn">🎙️ Записать ответ</button>' : "") + '<div id="ians"></div></div>');
    sheet("", "", '<button class="btn" data-act="ireveal">Я ответила</button>');
    I.t0 = Date.now();
    I.timer = setInterval(() => {
      const sec = Math.floor((Date.now() - I.t0) / 1000);
      const el = document.getElementById("timer"); if (!el) return;
      el.textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
      el.classList.toggle("over", sec > 60);
    }, 250);
  }
  async function toggleRec(btn) {
    if (I.rec && I.rec.state === "recording") { I.rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      I.chunks = []; I.rec = new MediaRecorder(stream);
      I.rec.ondataavailable = (e) => I.chunks.push(e.data);
      I.rec.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        I.audioUrl = URL.createObjectURL(new Blob(I.chunks, { type: I.rec.mimeType || "audio/webm" }));
        const b = document.getElementById("recbtn"); if (b) { b.textContent = "✅ Записано"; b.disabled = true; }
        const box = document.getElementById("audio");
        if (box) box.innerHTML = '<p class="hint" style="margin:10px 0 6px">Твой ответ:</p><audio controls src="' + I.audioUrl + '" style="width:100%"></audio>';
      };
      I.rec.start(); btn.textContent = "⏹️ Остановить запись";
    } catch (e) { btn.textContent = "Микрофон недоступен"; btn.disabled = true; }
  }
  function iReveal() {
    stopTimer();
    const q = I.qs[I.i];
    document.getElementById("ians").innerHTML = '<div id="audio"></div><div class="answer" style="margin-top:14px">' + rich(q.a) + "</div>" +
      '<div class="card"><p class="kind" style="margin-bottom:4px">Что ты сказала</p>' +
      q.k.map((k, i) => '<label class="check"><input type="checkbox" data-key="' + i + '"><span>' + rich(k) + "</span></label>").join("") + "</div>";
    stopRec();
    sheet("", "", '<button class="btn" data-act="inext">Дальше</button>');
    document.getElementById("ians").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function iNext() {
    const q = I.qs[I.i];
    const boxes = [...app.querySelectorAll("[data-key]")];
    const score = boxes.length ? boxes.filter((b) => b.checked).length / boxes.length : 0;
    I.scores.push({ q, score });
    grade(q.id, score >= 0.75 ? "good" : score >= 0.5 ? "ok" : "bad");
    addXp(Math.round(4 + score * 8));
    I.i++; iStep();
  }
  function iFinish() {
    stopTimer();
    const avg = Math.round(I.scores.reduce((a, s) => a + s.score, 0) / Math.max(1, I.scores.length) * 100);
    const list = I.scores.map((s) => '<div class="cs-item"><p class="cs-q">' + rich(s.q.q) + '</p><div class="bar"><i style="width:' + Math.round(s.score * 100) +
      '%;background:' + (s.score >= 0.75 ? "var(--green)" : s.score >= 0.5 ? "var(--amber)" : "var(--red)") + '"></i></div></div>').join("");
    view('<div class="wrap">' + topbar() + '<div class="done-hero"><div class="big">🎙️</div><h1>Собеседование пройдено</h1><p class="sub">В среднем ты назвала ' + avg +
      '% ключевых пунктов. Вопросы ниже 50% попали в «Слабые места».</p></div><div class="card">' + list +
      '</div><div style="height:16px"></div><button class="btn" data-go="interview">Ещё раз</button><div style="height:14px"></div><button class="btn ghost" data-go="home">На главную</button></div>');
  }

  // ---------- шпаргалка ----------
  let cheatTab = "qa";
  function cheat(tab) {
    if (tab) cheatTab = tab;
    view('<div class="wrap"><button class="back" data-go="home">← Назад</button><h1>Шпаргалка</h1>' +
      '<div class="tabs"><button data-tab="qa" class="' + (cheatTab === "qa" ? "on" : "") + '">Ответы</button><button data-tab="defs" class="' + (cheatTab === "defs" ? "on" : "") + '">Определения</button></div>' +
      '<input class="search" id="cs" type="search" placeholder="Поиск" aria-label="Поиск"><div id="cslist"></div></div>');
    drawCheat("");
    document.getElementById("cs").addEventListener("input", (e) => drawCheat(e.target.value));
  }
  function drawCheat(filter) {
    const f = filter.trim().toLowerCase();
    const html = UNITS.map((u) => {
      if (cheatTab === "defs") {
        const ds = defsOf(u.id).filter((d) => !f || plain(d.term + " " + d.d).toLowerCase().includes(f));
        if (!ds.length) return "";
        return '<div class="card" style="margin:0 0 14px"><h2>' + u.icon + " " + esc(u.title) + "</h2>" +
          ds.map((d) => '<div class="gl"><b>' + rich(d.term) + "</b><span>" + rich(d.d) + "</span></div>").join("") + "</div>";
      }
      const items = QA.filter((q) => q.u === u.id && (!f || plain(q.q + " " + q.a + " " + q.k.join(" ")).toLowerCase().includes(f)));
      if (!items.length) return "";
      return '<div class="card" style="margin:0 0 14px"><h2>' + u.icon + " " + esc(u.title) + "</h2>" + items.map((q) =>
        '<div class="cs-item"><p class="cs-q">' + rich(q.q) + '<span class="lvl">' + "●".repeat(q.l) + "</span></p><div>" + rich(q.a) + "</div>" +
        (q.c ? "<details><summary>Код</summary><pre><code>" + esc(q.c) + "</code></pre></details>" : "") + "</div>").join("") + "</div>";
    }).join("");
    document.getElementById("cslist").innerHTML = html || '<p class="sub">Ничего не нашлось.</p>';
  }

  // ---------- профиль ----------
  function profile() {
    const groups = uniq(FIELDS.map((f) => f.group));
    view('<div class="wrap"><button class="back" data-go="home">← Назад</button><h1>Профиль</h1>' +
      '<p class="sub">Эти значения подставляются в ответы и проверяются во «впиши ответ». Сейчас стоят значения из модели проекта — замени их на свои реальные. Хранятся только в этом браузере.</p>' +
      groups.map((g) => '<p class="group">' + esc(g) + "</p>" + FIELDS.filter((f) => f.group === g).map((f) =>
        '<div class="field"><label for="f-' + f.key + '">' + esc(f.label) + '</label><input id="f-' + f.key + '" data-field="' + f.key + '" value="' +
        esc(S.profile[f.key] !== undefined ? S.profile[f.key] : f.def) + '"></div>').join("")).join("") +
      '<div class="row2" style="margin-top:24px"><button class="btn ghost" data-act="resetProfile">Вернуть значения модели</button>' +
      '<button class="btn red" data-act="resetProgress">Сбросить прогресс</button></div></div>');
    app.querySelectorAll("[data-field]").forEach((inp) => inp.addEventListener("input", (e) => { S.profile[e.target.dataset.field] = e.target.value; save(); }));
  }
  function confirmTap(btn, label, fn) {
    if (btn.dataset.armed) { fn(); return; }
    const original = btn.textContent;
    btn.dataset.armed = "1"; btn.textContent = label;
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = original; } }, 4000);
  }

  // ---------- навигация ----------
  function go(name) {
    stopTimer(); stopRec();
    if (clockTimer && name !== "mix") { clearInterval(clockTimer); clockTimer = null; }
    ({ home, review: startReview, interview: startInterview, cheat: () => cheat(), progress, profile, mix: startMix })[name]();
  }
  const actions = {
    reveal: revealFlash, revealFollow,
    followGood: () => { const s = cur(); if (!L.gradedIds.has(s.id)) { grade(s.id, "good"); L.gradedIds.add(s.id); } give(8); next(); },
    followBad: () => { const s = cur(); grade(s.id, "bad"); L.gradedIds.add(s.id); L.misses.push(s); give(2); next(); },
    check: () => check(false), giveup: () => check(true), next,
    pairsDone: () => { const s = cur(); give(Math.max(2, 10 - s.miss * 2)); next(); },
    quit: () => { if (L && L.graded) finish(); else go("home"); },
    iquit: () => go("home"),
    rec: (btn) => toggleRec(btn), ireveal: iReveal, inext: iNext,
    hideTip: () => { S.tipHidden = true; save(); home(); },
    resetProfile: (btn) => confirmTap(btn, "Нажми ещё раз", () => { S.profile = {}; save(); profile(); }),
    resetProgress: (btn) => confirmTap(btn, "Нажми ещё раз", () => { Object.assign(S, { xp: 0, streak: 0, last: null, day: null, dayXp: 0, hist: {}, cards: {} }); save(); home(); })
  };
  document.addEventListener("click", (e) => {
    const el = e.target.closest("button");
    if (!el || el.disabled) return;
    const d = el.dataset;
    if (d.go) return go(d.go);
    if (d.unit) return startUnit(+d.unit);
    if (d.tab) return cheat(d.tab);
    if (d.opt !== undefined) return pickOpt(+d.opt, el);
    if (d.rate) return rate(d.rate);
    if (d.pl !== undefined || d.pr !== undefined) return pairTap(el);
    if (d.oi !== undefined) { cur().picked.push(+d.oi); return drawOrder(); }
    if (d.ou !== undefined) { cur().picked.splice(+d.ou, 1); return drawOrder(); }
    if (d.act && actions[d.act]) actions[d.act](el);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (document.activeElement && document.activeElement.id === "typed") { e.preventDefault(); check(false); return; }
    const nb = sheetEl && sheetEl.querySelector('[data-act="next"]');
    if (nb) { e.preventDefault(); nb.click(); }
  });

  home();
})();

</script>
</body>
</html>
